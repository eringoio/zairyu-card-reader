name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Never post real residence-card data

        This is a **public** issue tracker. Anything you paste here is visible to everyone
        and is retained in the edit history even if you delete it afterwards.

        **Do not post:**

        - photographs or scans of a real residence card;
        - screenshots showing a real name, address, date of birth, or card number;
        - real card numbers, names, addresses, dates of birth, or nationalities;
        - APDU, TLV, or IC-chip dumps;
        - card certificates or signatures;
        - logs or trace files containing any of the above.

        Use synthetic values, exactly as the tests do — `SAMPLE NAME`, `SAMPLELAND`,
        `AB12345678AJ`. **Describing the shape of the data is almost always enough.**

        If you need a screenshot, tick the sample-data option in the application, read once,
        and screenshot that.

        **Found a security vulnerability?** Do not open an issue. Use private reporting —
        see `SECURITY.md`.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included any real residence-card data, image, or personal information in this report.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did the application do instead of what you expected?
      placeholder: |
        1. Started zairyu-reader.exe
        2. Selected my reader and saved
        3. Pressed 読み取り開始
        4. Expected the 17 fields; got ... instead
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Exact message shown
      description: >-
        Copy the message text. Redact anything card-derived before pasting; if you are not
        sure whether a value is card-derived, leave it out.
      render: text
  - type: input
    id: reader
    attributes:
      label: Card reader model
      placeholder: e.g. SONY RC-S380
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2, or Windows Server 2016 with Desktop Experience
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Released Windows package (zairyu-reader.exe)
        - From source (python app.py)
        - From source (python launch_reader.py)
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (source installs only)
      placeholder: e.g. 3.13.2
  - type: dropdown
    id: mock
    attributes:
      label: Does sample-data mode work?
      description: >-
        Ticking the sample-data option exercises the UI and copy format without touching
        hardware. This separates a reader problem from an application problem.
      options:
        - "Yes — sample data reads and displays correctly"
        - "No — sample data also fails"
        - "Not tried"
    validations:
      required: true

name: Regenerate security lockfile

on:
  push:
    branches:
      - agent/cryptography-50-security-fix
    paths:
      - requirements.txt
      - .github/workflows/regenerate-security-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cryptography-50-security-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate lockfile
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --strip-extras --output-file=requirements.lock.txt requirements.txt
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- requirements.lock.txt; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          git commit -m "Regenerate lockfile for cryptography 50"
          git push origin HEAD:agent/cryptography-50-security-fix

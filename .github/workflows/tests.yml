name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the supported platform. Ubuntu is included because it catches
        # path, line-ending and case-sensitivity mistakes that Windows hides — the OCR
        # assets are verified byte-for-byte against a manifest, so a line-ending
        # difference between platforms is a real failure, not a nuisance.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Ubuntu PC/SC build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes swig libpcsclite-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        # The OCR model is not tracked in Git and is not staged in CI, so tests that
        # need model.onnx skip themselves. Everything else — including the checksum,
        # line-ending, trust-anchor, privacy-output and local-networking tests — runs.
        run: pytest -q

      - name: Check that no CRLF reached a checksum-verified asset
        shell: bash
        run: |
          for f in resources/ocr/ppocrv6/inference.yml resources/ocr/ppocrv6/dictionary.txt; do
            if [ -f "$f" ] && grep -qU $'\r' "$f"; then
              echo "::error file=$f::CRLF found in a checksum-verified asset; check .gitattributes"
              exit 1
            fi
          done
          echo "no CRLF in checksum-verified assets"

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check static/local.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      # `ruff format --check` is deliberately not run. The rule selection and the
      # documented exceptions live in pyproject.toml; imposing a formatter on an existing,
      # tested codebase would rewrite hundreds of lines for no behavioural gain.

  package-resources:
    name: Package resource validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The PyInstaller spec must not bundle a script payload
        shell: bash
        run: |
          if grep -qE '\.(ps1|bat|cmd)' zairyu-reader.spec; then
            echo "::error file=zairyu-reader.spec::the spec references a script payload"
            exit 1
          fi
          echo "spec bundles no script payload"
      - name: Every resource the spec bundles must exist
        shell: bash
        run: |
          set -e
          for path in static resources/ocr resources/moj/trust-anchors; do
            test -e "$path" || { echo "::error::missing packaged resource: $path"; exit 1; }
          done
          test -f resources/moj/trust-anchors/manifest.json
          test -f resources/ocr/ppocrv6/manifest.json
          echo "all packaged resource paths present"

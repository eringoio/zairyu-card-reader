name: Regenerate Windows runtime lockfile

on:
  push:
    branches:
      - agent/runtime-minor-patch-updates
    paths:
      - .github/workflows/regenerate-runtime-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-minor-patch-updates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate lockfile
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26" pip-tools
          pip-compile --generate-hashes --strip-extras --output-file=requirements.lock.txt requirements.txt
      - name: Commit generated lockfile
        shell: pwsh
        run: |
          git diff --quiet -- requirements.lock.txt
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfile already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          git commit -m "Regenerate Windows runtime lockfile"
          git push origin HEAD:agent/runtime-minor-patch-updates

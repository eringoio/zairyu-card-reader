version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for the routine churn, so review attention goes to the
      # security-relevant packages below rather than to patch bumps.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - cryptography
          - pyscard
          - onnxruntime
    ignore:
      # Major versions are a deliberate, tested upgrade here. requirements.txt sets a
      # ceiling on every direct dependency for the same reason.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pydantic pins its matching core release exactly. Updating the transitive package
      # alone produces an unsatisfiable lockfile; it is updated with pydantic instead.
      - dependency-name: "pydantic-core"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"

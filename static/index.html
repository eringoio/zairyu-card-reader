<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <!-- Replaced per process by the local server. A page obtained any other way does not
         carry a valid token, and every staff API call made from it is refused. -->
    <meta name="local-request-token" content="__LOCAL_REQUEST_TOKEN__">
    <title>在留カードリーダー</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell" id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">ローカル在留カードリーダー</p>
          <h1 data-i18n="title">在留カードリーダー</h1>
          <p class="subtitle" data-i18n="subtitle">カードを読み取り、内容を確認できます</p>
        </div>
        <div class="topbar-actions">
          <div class="language-picker" role="group" aria-label="Language">
            <button id="langJa" type="button" class="language-button" aria-pressed="true">日本語</button>
            <button id="langEn" type="button" class="language-button" aria-pressed="false">English</button>
          </div>
          <span id="healthStatus" class="health" role="status" aria-live="polite">確認中</span>
        </div>
      </header>
      <aside id="officialTestWarning" class="advanced-warning" hidden role="alert"></aside>

      <section class="panel reader-panel" aria-labelledby="readerHeading">
        <div class="panel-heading"><div><p class="section-kicker" data-i18n="reader_kicker">準備</p><h2 id="readerHeading" data-i18n="reader_heading">カードリーダー</h2></div><button id="refreshReaders" type="button" class="secondary" data-i18n="refresh">状態を更新</button></div>
        <div class="reader-layout"><div class="reader-indicator" id="readerIndicator" data-state="unknown"><span class="indicator-dot" aria-hidden="true"></span><div><strong id="readerStatus">確認中</strong><p id="readerHint"></p></div></div><div class="reader-choice"><label for="readerSelect" data-i18n="reader_select">使用するカードリーダー</label><select id="readerSelect" aria-describedby="readerHint"></select><button id="saveReader" type="button" class="secondary" data-i18n="save">保存</button></div></div>
      </section>

      <section class="panel workflow-panel" aria-labelledby="scanHeading">
        <div class="panel-heading"><div><p class="section-kicker" data-i18n="scan_kicker">このPCで読み取る</p><h2 id="scanHeading" data-i18n="scan_heading">在留カードの読み取り</h2></div></div>
        <ol class="instruction-list"><li data-i18n="step_1">在留カードをリーダーに置きます</li><li data-i18n="step_2">カード表面の在留カード番号を入力します</li><li data-i18n="step_3">「読み取り開始」を押します</li><li data-i18n="step_4">読み取り結果をカードと照合します</li></ol>
        <aside class="privacy-notice"><strong data-i18n="privacy_title">プライバシーについて</strong><p data-i18n="privacy_text">本人の同意がある、確認を許可されたカードのみ読み取ってください。顔写真、マイナンバー、ICの生データは保存・表示しません。必要な画像処理はメモリ上で行い、画像自体は出力しません。</p></aside>
        <div class="scan-form"><label class="field-label" for="cardNumber" data-i18n="card_number">在留カード番号（カード表面に印字）</label><input id="cardNumber" maxlength="12" autocomplete="off" placeholder="AB12345678AJ" aria-describedby="scanMessage"><label class="test-option"><input id="useMock" type="checkbox"><span data-i18n="sample_data">開発・テスト用サンプルデータを使う</span></label><p id="sampleHint" class="sample-hint" hidden></p><div class="actions"><button id="checkCard" type="button" class="secondary" data-i18n="check_card">カードを確認</button><button id="readCard" type="button" data-i18n="start_read">読み取り開始</button></div><p id="scanMessage" class="message" role="status" aria-live="polite"></p></div>
      </section>

      <section class="panel result-panel" id="resultBlock" hidden aria-labelledby="resultHeading">
        <div class="panel-heading"><div><p class="section-kicker" data-i18n="result_kicker">確認</p><h2 id="resultHeading" data-i18n="result_heading">読み取り結果</h2></div><button id="discard" type="button" class="secondary" data-i18n="discard">破棄する</button></div>
        <div id="warnings" class="warnings" aria-live="polite"></div><table id="resultTable"></table>
        <div class="actions result-actions"><button id="showOcrDebug" type="button" class="secondary" data-i18n="ocr_diagnostics">OCR診断を表示</button></div>
        <pre id="ocrDebug" class="ocr-debug" hidden></pre>
      </section>
    </main>
    <script src="/static/local.js"></script>
  </body>
</html>
